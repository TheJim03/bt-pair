name: Build APK

# Pushing a tag like v1.0 builds btpair.apk and attaches it to a GitHub release.
# "Run workflow" in the Actions tab builds it as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; build.sh picks it up via ANDROID_HOME.
      - name: Build
        run: ./build.sh

      - name: Checksum
        run: sha256sum btpair.apk | tee btpair.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: btpair
          path: |
            btpair.apk
            btpair.apk.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" btpair.apk btpair.apk.sha256
          --title "$GITHUB_REF_NAME"
          --notes "Built from source by GitHub Actions. Install with: adb install btpair.apk"
